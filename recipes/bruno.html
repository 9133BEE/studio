<body>
<div class="wrap">
  <header>
    <h1>BRUNO 料理鍋・簡易食譜</h1>
    <p>BOE115 迷你多功能料理鍋專用　煮・煎・蒸・湯・放著就熟・炊飯　1–2 人份</p>
    <div class="tips"><ul>
      <li>容量 800ml，煮湯、煮麵的液體控制在 600ml 以內，滾的時候才不會溢出。</li>
      <li>火力 600W 比較溫和：煎類先把烤盤預熱 3–5 分鐘再下食材；煮滾的時間會比瓦斯爐久一點。</li>
      <li>火力從「保溫」調到「高」，食譜裡的低／中／高火對應刻度的低段、中段、高段。</li>
      <li>蒸的時候鍋裡放約 200ml 水再架蒸架，蒸超過 15 分鐘記得看一下水量，不夠就補熱水。</li>
      <li>炊飯一次煮 1 米杯就好，鍋底先抹一點油比較不會黏鍋。</li>
    </ul></div>
  </header>
  <nav id="nav"></nav>
  <main class="grid" id="list"></main>
  <footer>點開每道料理看食材與步驟</footer>
</div>

function spread(arr, x0, x1){
  if (arr.length === 1) return [(x0 + x1) / 2];
  return arr.map((_, k) => x0 + (x1 - x0) * k / (arr.length - 1));
}
function place(list, x0, x1, y, s){
  return spread(list, x0, x1).map((x, k) =>
    `<g transform="translate(${x.toFixed(1)} ${y}) scale(${s})">${TOK[list[k]] || ''}</g>`).join('');
}

function drawing(r, foods){
  const kind = r.p.includes('蒸架') ? 'steam' : r.p.includes('烤盤') ? 'plate' : 'pot';
  const lid = r.p.includes('玻璃蓋');
  const rice = foods.includes('r'), custard = foods.includes('cus');
  const items = foods.filter(f => f !== 'r' && f !== 'cus');
  let g = '';
  // 機身
  g += '<rect class="f-unit" x="50" y="130" width="200" height="28" rx="10"/><circle class="f-metal" cx="228" cy="144" r="6"/><text class="f-lbl" x="70" y="148">BOE115</text>';
  if (kind === 'plate') {
    g += '<rect class="f-plate" x="58" y="114" width="184" height="16" rx="5"/>';
    g += place(items, 84, 216, 106, 1);
    if (lid) g += '<path class="f-glass" d="M56 114Q150 62 244 114"/><rect class="f-metal" x="143" y="80" width="14" height="7" rx="3"/>';
  } else {
    g += '<rect class="f-metal" x="56" y="74" width="12" height="7" rx="3"/><rect class="f-metal" x="232" y="74" width="12" height="7" rx="3"/>';
    g += '<rect class="f-metal" x="66" y="62" width="168" height="68" rx="6"/><rect class="f-inner" x="72" y="66" width="156" height="60" rx="3"/>';
    if (kind === 'steam') {
      g += '<rect class="f-water" x="72" y="110" width="156" height="16"/>';
      g += '<path class="f-rack" d="M80 106H220M100 106v-4M150 106v-4M200 106v-4"/>';
      g += '<path class="f-bowl" d="M108 78H192Q188 102 150 102Q112 102 108 78z"/>';
      if (custard) g += '<path fill="#f4d27a" d="M111 82H189Q186 98 150 98Q114 98 111 82z"/>';
      g += place(items, 126, 174, 86, .7);
    } else if (rice) {
      g += '<rect fill="#f4ecdb" x="72" y="96" width="156" height="30"/>';
      g += [...Array(26)].map((_, k) => `<ellipse fill="#ffffff" stroke="#e2d6bd" stroke-width=".5" cx="${80 + (k % 13) * 11.5}" cy="${104 + Math.floor(k / 13) * 10 + (k % 2) * 3}" rx="3" ry="1.6"/>`).join('');
      g += place(items, 96, 204, 94, 1);
    } else {
      g += '<rect class="f-liquid" x="72" y="90" width="156" height="36"/>';
      g += place(items, 94, 206, 92, 1);
    }
    if (lid) g += '<path class="f-glass" d="M62 62Q150 24 238 62"/><rect class="f-metal" x="143" y="35" width="14" height="7" rx="3"/>';
  }
  if (lid || kind === 'steam') {
    const top = kind === 'plate' ? 72 : 30;
    g += [120, 150, 180].map(x => `<path class="f-steam" d="M${x} ${top}q-5-6 0-12t0-12"/>`).join('');
  }
  return `<svg viewBox="0 0 300 162" role="img" aria-label="${esc(r.n)} 擺放圖解">${g}</svg>`;
}

const LV = {'高':['高火',3,'hi'],'中':['中火',2,'mid'],'低':['低火',1,'lo'],'關':['關火',0,'off']};
function flow(str){
  return str.split('|').map(seg => {
    const [lv, txt] = seg.split(':'), [name, n, cls] = LV[lv];
    const bars = [1,2,3].map(b => `<i class="${b <= n ? 'on' : ''}"></i>`).join('');
    return `<span class="fs ${cls}"><span class="bars">${bars}</span><b>${name}</b>${esc(txt)}</span>`;
  }).join('<span class="arr">→</span>');
}
function figure(r){
  const d = DIAG[r.n];
  if (!d) return '';
  return `<h3>圖解</h3><div class="fig">${drawing(r, d[0].split(','))}<div class="flow">${flow(d[1])}</div></div>`;
}

const nav = document.getElementById('nav');
const list = document.getElementById('list');
const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function render(cat){
  [...nav.children].forEach(b => b.classList.toggle('on', b.dataset.c === cat));
  list.innerHTML = DATA[cat].map(r => `
    <details>
      <summary><span class="name">${esc(r.n)}</span><span class="meta">${r.t}・${r.s}</span></summary>
      <div class="body">
        <div class="chips"><span class="chip">配件：${esc(r.p)}</span></div>
        ${figure(r)}
        <h3>食材</h3><ul>${r.i.map(x => `<li>${esc(x)}</li>`).join('')}</ul>
        <h3>步驟</h3><ol>${r.st.map(x => `<li>${esc(x)}</li>`).join('')}</ol>
        <div class="note">小撇步：${esc(r.tip)}</div>
      </div>
    </details>`).join('');
  try { localStorage.setItem('bruno-cat', cat); } catch(e) {}
}

Object.keys(DATA).forEach(cat => {
  const b = document.createElement('button');
  b.textContent = cat; b.dataset.c = cat;
  b.onclick = () => render(cat);
  nav.appendChild(b);
});

let saved = null;
try { saved = localStorage.getItem('bruno-cat'); } catch(e) {}
render(DATA[saved] ? saved : '煮');
</script>
</body>
</html>
