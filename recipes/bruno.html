<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BRUNO料理鍋食譜</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f5f3ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BRUNO食譜">
<style>
/* 版面：手機優先的卡片牆 + 固定篩選列 + 底部彈出的食譜頁 */
:root{
  --bg:#f5f3ee; --surface:#ffffff; --ink:#1f2a44; --muted:#687087; --line:#e3e0d7;
  --accent:#e2492f; --on-accent:#ffffff; --soft:#ece9e1; --sage:#557f45; --scrim:rgba(20,24,36,.45);
  --unit:#d8d0c6; --metal:#b4aea7; --inner:#e9e5e0; --liquid:#efc794; --water:#bcd9e6;
  --plate:#4a4542; --bowl:#fbf8f3; --glass:#8fbcd0; --glass-fill:rgba(143,188,208,.16);
  --hi:#d4412b; --mid:#d07a17; --lo:#a98712;
  --radius:14px;
  --font:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141925; --surface:#1d2331; --ink:#e9eaef; --muted:#9ba2b4; --line:#2e3547;
    --accent:#f06a4f; --on-accent:#1a0d09; --soft:#252c3c; --sage:#8cbc78; --scrim:rgba(0,0,0,.6);
    --unit:#4b4541; --metal:#857e78; --inner:#3a3633; --liquid:#9a6e44; --water:#3f6475;
    --plate:#151312; --bowl:#ece6dd; --glass:#6f9fb5; --glass-fill:rgba(111,159,181,.14);
    --hi:#f0705a; --mid:#f0a24a; --lo:#e0c25a; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141925; --surface:#1d2331; --ink:#e9eaef; --muted:#9ba2b4; --line:#2e3547;
  --accent:#f06a4f; --on-accent:#1a0d09; --soft:#252c3c; --sage:#8cbc78; --scrim:rgba(0,0,0,.6);
  --unit:#4b4541; --metal:#857e78; --inner:#3a3633; --liquid:#9a6e44; --water:#3f6475;
  --plate:#151312; --bowl:#ece6dd; --glass:#6f9fb5; --glass-fill:rgba(111,159,181,.14);
  --hi:#f0705a; --mid:#f0a24a; --lo:#e0c25a; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.65;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:960px;margin:0 auto;padding-inline:16px}

/* 頁首 */
.top{padding-block:28px 6px;display:grid;gap:4px}
.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--accent);font-weight:600}
.top h1{margin:0;font-size:28px;line-height:1.25;font-weight:700;letter-spacing:.02em;text-wrap:balance}
.count{color:var(--muted);font-size:14px}

/* 使用須知 */
.notice{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.notice summary{list-style:none;cursor:pointer;padding:12px 16px;font-size:14px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.notice summary::-webkit-details-marker{display:none}
.notice summary::after{content:"＋";color:var(--muted);font-weight:400}
.notice[open] summary::after{content:"－"}
.notice ul{margin:0;padding:0 16px 14px 34px;font-size:13.5px;color:var(--muted)}
.notice li{margin:3px 0}

/* 搜尋 + 篩選（固定在上方） */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;display:grid;gap:10px;margin-top:6px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.search svg{flex:none;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:16px;padding:11px 0;outline:none}
.search input::placeholder{color:var(--muted)}
.bar{grid-template-columns:minmax(0,1fr)}
.scroller{min-width:0;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.scroller::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:transparent;padding:6px 2px;font-size:16px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-right:10px}
.tab.on{color:var(--ink);font-weight:700;border-color:var(--accent)}
.tab small{font-size:12px;margin-left:3px;color:var(--muted);font-weight:400}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;font-size:14px;cursor:pointer}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}

/* 卡片牆 */
main{padding-block:6px 56px}
.group{margin-top:18px}
.group h2{font-size:15px;margin:0 0 10px;color:var(--muted);font-weight:600;letter-spacing:.06em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px}
.card{display:grid;grid-template-rows:auto 1fr;text-align:left;border:1px solid var(--line);background:var(--surface);
  border-radius:var(--radius);padding:0;cursor:pointer;overflow:hidden;transition:transform .15s ease,box-shadow .15s ease}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(20,24,36,.08)}
.thumb{background:var(--soft);padding:8px 6px 2px}
.thumb svg{display:block;width:100%;height:auto}
.info{padding:10px 12px 12px;display:grid;gap:4px;align-content:start;min-width:0}
.info b{font-size:15px;line-height:1.35;font-weight:600}
.meta{font-size:12.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.vessel{font-size:11.5px;border-radius:5px;padding:0 6px;background:var(--soft);color:var(--ink)}
.empty{padding:48px 0;text-align:center;color:var(--muted)}
.empty button{margin-top:10px}

/* 圖解元件 */
.f-unit{fill:var(--unit)} .f-metal{fill:var(--metal)} .f-inner{fill:var(--inner)}
.f-liquid{fill:var(--liquid)} .f-water{fill:var(--water)} .f-plate{fill:var(--plate);stroke:var(--metal);stroke-width:1.5}
.f-bowl{fill:var(--bowl);stroke:var(--metal);stroke-width:1}
.f-rack{stroke:var(--ink);stroke-width:2;fill:none;opacity:.5}
.f-glass{fill:var(--glass-fill);stroke:var(--glass);stroke-width:2.5}
.f-steam{fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;opacity:.6}
.f-lbl{fill:var(--muted);font-size:9px;letter-spacing:.1em}

/* 食譜頁（彈出） */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:620px;max-height:92vh;max-height:92dvh;overflow-y:auto;border-radius:20px 20px 0 0;
  padding:0 0 calc(24px + env(safe-area-inset-bottom,0px));animation:up .22s ease}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:20px;max-height:88vh}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.card{transition:none}}
.sh-head{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:flex-start;gap:12px;padding:18px 16px 12px;border-bottom:1px solid var(--line)}
.sh-head > div{flex:1;min-width:0}
.sh-head .eyebrow{display:block;margin-bottom:2px}
.sh-head h2{margin:0;font-size:22px;line-height:1.3;text-wrap:balance}
.sh-head .meta{margin-top:4px;font-size:13.5px}
.close{flex:none;width:36px;height:36px;border-radius:50%;border:0;background:var(--soft);font-size:20px;line-height:1;cursor:pointer}
.sh-body{padding:16px;display:grid;gap:22px}
.figure{background:var(--soft);border-radius:var(--radius);padding:14px 12px 12px;display:grid;gap:12px}
.figure svg{width:100%;max-width:360px;height:auto;display:block;margin:0 auto}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.fs{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px 9px}
.fs b{font-weight:600}
.bars{display:inline-flex;align-items:flex-end;gap:2px}
.bars i{width:4px;background:var(--line);border-radius:1px}
.bars i:nth-child(1){height:6px}.bars i:nth-child(2){height:9px}.bars i:nth-child(3){height:12px}
.fs.hi .bars i.on{background:var(--hi)} .fs.mid .bars i.on{background:var(--mid)} .fs.lo .bars i.on{background:var(--lo)}
.fs.hi b{color:var(--hi)} .fs.mid b{color:var(--mid)} .fs.lo b{color:var(--lo)} .fs.off b{color:var(--muted)}
.arr{color:var(--muted)}
.sec h3{margin:0 0 8px;font-size:13px;letter-spacing:.12em;color:var(--accent);display:flex;justify-content:space-between;align-items:baseline}
.sec h3 small{letter-spacing:0;color:var(--muted);font-weight:400;font-size:12px}
.ings{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.ings button{width:100%;display:flex;gap:10px;align-items:flex-start;text-align:left;background:transparent;border:0;padding:7px 4px;font-size:15px;cursor:pointer;border-radius:8px}
.ings button:hover{background:var(--soft)}
.box{flex:none;width:18px;height:18px;margin-top:3px;border:1.5px solid var(--muted);border-radius:5px;display:grid;place-items:center;font-size:12px;color:var(--on-accent)}
.ings .done .box{background:var(--sage);border-color:var(--sage)}
.ings .done .box::after{content:"✓";color:#fff}
.ings .done .txt{color:var(--muted);text-decoration:line-through}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:14px;counter-reset:s}
.steps li{display:grid;grid-template-columns:30px 1fr;gap:12px;font-size:15px;counter-increment:s}
.steps li::before{content:counter(s);width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:14px}
.tip{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;font-size:14px}
.tip b{color:var(--sage);margin-right:6px}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pager button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;text-align:left;cursor:pointer;font-size:14px;min-width:0}
.pager button:last-child{text-align:right}
.pager small{display:block;color:var(--muted);font-size:12px}
.pager span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pager button:disabled{visibility:hidden}
.reset{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 16px;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <span class="eyebrow">BRUNO BOE115・1–2 人份</span>
    <h1>迷你料理鍋食譜</h1>
    <span class="count" id="count"></span>
    <details class="notice">
      <summary>使用這台鍋子前先看</summary>
      <ul>
        <li>容量 800ml，湯和麵的液體控制在 600ml 以內，滾的時候才不會溢出。</li>
        <li>火力 600W 比較溫和：煎類先把烤盤預熱 3–5 分鐘；煮滾會比瓦斯爐久一點。</li>
        <li>火力從「保溫」調到「高」，食譜裡的低／中／高火對應刻度的低段、中段、高段。</li>
        <li>蒸的時候鍋裡放約 200ml 水再架蒸架，蒸超過 15 分鐘記得看水量。</li>
        <li>炊飯一次煮 1 米杯就好，鍋底先抹一點油比較不會黏鍋。</li>
      </ul>
    </details>
  </header>

  <div class="bar">
    <label class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="搜尋菜名或食材，例如：櫛瓜" autocomplete="off">
    </label>
    <div class="scroller" id="tabs" role="tablist" aria-label="分類"></div>
    <div class="scroller" id="chips" aria-label="依食材篩選"></div>
  </div>

  <main id="list"></main>
</div>

<div class="scrim" id="scrim" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-title"></div>
</div>

<script>
const DATA = {
  "煮": [
    {n:"迷你壽喜燒",t:"20 分",s:"1–2 人",p:"鍋 + 玻璃蓋",
     i:["火鍋牛肉片 150g","洋蔥 1/4 顆、青蔥 1 根","板豆腐 1/2 盒、金針菇 1/2 包","娃娃菜 適量","醬汁：醬油 2 大匙、味醂 2 大匙、米酒 1 大匙、糖 2 小匙、水 100ml","生蛋（沾食用，可省）"],
     st:["高火，鍋裡放少許油，先炒香洋蔥與蔥段。","倒入醬汁煮滾。","排入豆腐、菇類、娃娃菜，蓋上玻璃蓋煮 5 分鐘。","轉中火，牛肉片一次放幾片，煮到變色就吃，邊煮邊加。"],
     tip:"鍋子小，牛肉分批涮才不會讓湯溫掉太多；剩下的醬汁加一球烏龍麵剛好收尾。"},
    {n:"番茄燉雞腿",t:"30 分",s:"1–2 人",p:"鍋 + 玻璃蓋",
     i:["去骨雞腿 1 片（切塊）","牛番茄 1 顆、洋蔥 1/4 顆","蒜頭 2 瓣","番茄醬 1 大匙、鹽 少許、糖 1/2 小匙","水 100ml"],
     st:["高火，雞皮朝下煎到出油上色。","放入洋蔥、蒜末炒軟。","加入番茄塊、番茄醬和水，煮滾。","蓋上玻璃蓋轉低火燉 15 分鐘，最後用鹽、糖調味。"],
     tip:"配一碗白飯剛好一人份；馬鈴薯切小丁也可以一起燉。"},
    {n:"一人份奶油蛤蜊麵",t:"20 分",s:"1 人",p:"鍋 + 玻璃蓋",
     i:["義大利麵 80g（對折）","蛤蜊 150g（先吐沙）","蒜頭 2 瓣、辣椒 少許","奶油 10g、米酒或白酒 30ml","水 350ml、鹽 少許、巴西里 適量"],
     st:["中火融化奶油，爆香蒜片、辣椒。","放入蛤蜊與酒，蓋上玻璃蓋，煮到殼打開後先夾出來。","加水煮滾，放入對折的義大利麵，依包裝時間多煮 1–2 分鐘，期間攪拌避免黏鍋。","湯汁收到微稠，放回蛤蜊拌勻，撒上巴西里。"],
     tip:"麵對折才放得進鍋子；蛤蜊本身有鹹味，鹽最後試過味道再加。"},
    {n:"韓式辣炒年糕",t:"15 分",s:"1–2 人",p:"鍋",
     i:["韓式年糕 150g","魚板 1 片、高麗菜 少許、青蔥 1 根","韓式辣醬 1 大匙、醬油 1/2 大匙、糖 1/2 大匙","水 200ml","水煮蛋 1 顆（可加）"],
     st:["水和所有醬料攪勻，高火煮滾。","放入年糕、魚板、高麗菜。","中火煮 6–8 分鐘，常攪拌，煮到醬汁濃稠。","撒蔥段、放水煮蛋就完成。"],
     tip:"最後蓋一片起司片，就是起司辣炒年糕。"}
  ],
  "煎": [
    {n:"冰花煎餃",t:"15 分",s:"1 人",p:"烤盤 + 玻璃蓋",
     i:["冷凍水餃 8 顆","麵粉水：麵粉 1/2 大匙 + 水 80ml","油 1/2 大匙","芝麻、蔥花 少許"],
     st:["高火預熱烤盤 3–5 分鐘，抹油，水餃排好（不用退冰）。","倒入攪勻的麵粉水，蓋上玻璃蓋。","燜煮約 8–10 分鐘，到水分收乾。","開蓋繼續煎到底部金黃酥脆，撒芝麻、蔥花。"],
     tip:"麵粉水換成太白粉水，冰花會更薄更脆。"},
    {n:"香煎鮭魚佐檸檬奶油",t:"15 分",s:"1 人",p:"烤盤",
     i:["鮭魚 1 片","鹽、黑胡椒 適量","奶油 10g、蒜末 1/2 小匙","檸檬 1/4 顆","蘆筍 4–5 根"],
     st:["鮭魚用廚房紙巾擦乾，兩面撒鹽和黑胡椒。","高火預熱烤盤，魚皮朝下煎 4–5 分鐘到酥脆。","翻面再煎 3 分鐘，旁邊放蘆筍一起煎。","轉低火放入奶油和蒜末，融化後淋在魚上，擠一點檸檬汁。"],
     tip:"魚下鍋後先別翻動，皮才會完整；鮭魚太大片可以切半再煎。"},
    {n:"培根蘆筍捲佐荷包蛋",t:"12 分",s:"1 人",p:"烤盤 + 玻璃蓋",
     i:["培根 3 片","蘆筍 6 根（切半）","雞蛋 1 顆","黑胡椒 少許","吐司 1 片（可加）"],
     st:["蘆筍兩根一組，用培根捲起來。","中火預熱烤盤，培根捲接縫朝下放，培根會自己出油，不用另外加油。","煎到培根上色後翻面，旁邊打入雞蛋。","蓋上玻璃蓋燜 2 分鐘，蛋白凝固就好，撒黑胡椒。"],
     tip:"培根煎出的油可以順便把吐司兩面煎香，就是一份完整的早餐盤。"},
    {n:"迷你鬆餅",t:"20 分",s:"1–2 人",p:"烤盤",
     i:["鬆餅粉 100g","雞蛋 1 顆","牛奶 75ml","奶油 少許","楓糖、水果 適量"],
     st:["鬆餅粉、蛋、牛奶拌到看不到粉粒就停，不要攪拌過度。","中低火預熱烤盤，抹薄薄一層奶油。","每次舀一大匙麵糊，一次煎 2–3 片小圓餅。","表面冒小泡泡就翻面，再煎約 1 分鐘，疊好淋楓糖、放水果。"],
     tip:"做小片比較好翻面，邊煎邊吃剛好當下午茶。"}
  ],
  "蒸": [

function spread(arr, x0, x1){
  if (arr.length === 1) return [(x0 + x1) / 2];
  return arr.map((_, k) => x0 + (x1 - x0) * k / (arr.length - 1));
}
function place(list, x0, x1, y, s){
  return spread(list, x0, x1).map((x, k) =>
    `<g transform="translate(${x.toFixed(1)} ${y}) scale(${s})">${TOK[list[k]] || ''}</g>`).join('');
}

function drawing(r, foods){
  const kind = r.p.includes('蒸架') ? 'steam' : r.p.includes('烤盤') ? 'plate' : 'pot';
  const lid = r.p.includes('玻璃蓋');
  const rice = foods.includes('r');
  const liq = LIQ[foods.find(f => LIQ[f])], fill = BOWL[foods.find(f => BOWL[f])];
  const items = foods.filter(f => f !== 'r' && !LIQ[f] && !BOWL[f]);
  let g = '';
  // 機身
  g += '<rect class="f-unit" x="50" y="130" width="200" height="28" rx="10"/><circle class="f-metal" cx="228" cy="144" r="6"/><text class="f-lbl" x="70" y="148">BOE115</text>';
  if (kind === 'plate') {
    g += '<rect class="f-plate" x="58" y="114" width="184" height="16" rx="5"/>';
    g += place(items, 84, 216, 106, 1);
    if (lid) g += '<path class="f-glass" d="M56 114Q150 62 244 114"/><rect class="f-metal" x="143" y="80" width="14" height="7" rx="3"/>';
  } else {
    g += '<rect class="f-metal" x="56" y="74" width="12" height="7" rx="3"/><rect class="f-metal" x="232" y="74" width="12" height="7" rx="3"/>';
    g += '<rect class="f-metal" x="66" y="62" width="168" height="68" rx="6"/><rect class="f-inner" x="72" y="66" width="156" height="60" rx="3"/>';
    if (kind === 'steam') {
      g += '<rect class="f-water" x="72" y="110" width="156" height="16"/>';
      g += '<path class="f-rack" d="M80 106H220M100 106v-4M150 106v-4M200 106v-4"/>';
      g += '<path class="f-bowl" d="M108 78H192Q188 102 150 102Q112 102 108 78z"/>';
      if (fill) g += `<path fill="${fill}" d="M111 82H189Q186 98 150 98Q114 98 111 82z"/>`;
      g += place(items, 126, 174, 86, .7);
    } else if (rice) {
      g += '<rect fill="#f4ecdb" x="72" y="96" width="156" height="30"/>';
      g += [...Array(26)].map((_, k) => `<ellipse fill="#ffffff" stroke="#e2d6bd" stroke-width=".5" cx="${80 + (k % 13) * 11.5}" cy="${104 + Math.floor(k / 13) * 10 + (k % 2) * 3}" rx="3" ry="1.6"/>`).join('');
      g += place(items, 96, 204, 94, 1);
    } else {
      g += `<rect class="f-liquid" x="72" y="90" width="156" height="36"${liq ? ` style="fill:${liq}"` : ''}/>`;
      g += place(items, 94, 206, 92, 1);
    }
    if (lid) g += '<path class="f-glass" d="M62 62Q150 24 238 62"/><rect class="f-metal" x="143" y="35" width="14" height="7" rx="3"/>';
  }
  if (lid || kind === 'steam') {
    const top = kind === 'plate' ? 72 : 30;
    g += [120, 150, 180].map(x => `<path class="f-steam" d="M${x} ${top}q-5-6 0-12t0-12"/>`).join('');
  }
  return `<svg viewBox="0 0 300 162" role="img" aria-label="${esc(r.n)} 擺放圖解">${g}</svg>`;
}

const LV = {'高':['高火',3,'hi'],'中':['中火',2,'mid'],'低':['低火',1,'lo'],'關':['關火',0,'off'],'保':['保溫',0,'off']};
function flow(str){
  return str.split('|').map(seg => {
    const [lv, txt] = seg.split(':'), [name, n, cls] = LV[lv];
    const bars = [1,2,3].map(b => `<i class="${b <= n ? 'on' : ''}"></i>`).join('');
    return `<span class="fs ${cls}"><span class="bars">${bars}</span><b>${name}</b>${esc(txt)}</span>`;
  }).join('<span class="arr">→</span>');
}
function figure(r){
  const d = DIAG[r.n];
  if (!d) return '';
  return `<h3>圖解</h3><div class="fig">${drawing(r, d[0].split(','))}<div class="flow">${flow(d[1])}</div></div>`;
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ALL = [];
Object.keys(DATA).forEach(cat => DATA[cat].forEach(r => ALL.push(Object.assign({cat}, r))));

const FILTERS = [
  ['櫛瓜',['櫛瓜']], ['蝦',['蝦']], ['蛋',['雞蛋']], ['豆腐',['豆腐']],
  ['雞肉',['雞腿','雞肉']], ['豬肉',['豬','排骨','培根']], ['牛肉',['牛肉']],
  ['魚貝',['鮭魚','蛤蜊']], ['米飯',['白米']]
];
const state = {cat:'全部', ing:null, q:''};
const $ = id => document.getElementById(id);

function vessel(r){ return r.p.includes('蒸架') ? '蒸' : r.p.includes('烤盤') ? '烤盤' : '鍋'; }
function hasIng(r, keys){ return r.i.some(x => keys.some(k => x.includes(k))); }
function matches(r){
  if (state.cat !== '全部' && r.cat !== state.cat) return false;
  if (state.ing && !hasIng(r, FILTERS.find(f => f[0] === state.ing)[1])) return false;
  if (state.q){
    const q = state.q.trim();
    if (q && !(r.n.includes(q) || r.i.some(x => x.includes(q)))) return false;
  }
  return true;
}

function renderBar(){
  const tabs = ['全部'].concat(Object.keys(DATA));
  $('tabs').innerHTML = tabs.map(c => {
    const n = c === '全部' ? ALL.length : DATA[c].length;
    return `<button class="tab${state.cat === c ? ' on' : ''}" role="tab" aria-selected="${state.cat === c}" data-cat="${c}">${c}<small>${n}</small></button>`;
  }).join('');
  $('chips').innerHTML = FILTERS.map(f =>
    `<button class="chip${state.ing === f[0] ? ' on' : ''}" aria-pressed="${state.ing === f[0]}" data-ing="${f[0]}">${f[0]}</button>`).join('');
}

let visible = [];
function card(r){
  const idx = ALL.indexOf(r);
  return `<button class="card" data-id="${idx}">
    <div class="thumb">${drawing(r, DIAG[r.n][0].split(','))}</div>
    <div class="info"><b>${esc(r.n)}</b>
      <span class="meta"><span class="vessel">${vessel(r)}</span>${esc(r.t)}・${esc(r.s)}</span></div>
  </button>`;
}
function renderList(){
  visible = ALL.filter(matches);
  $('count').textContent = `共 ${ALL.length} 道，目前顯示 ${visible.length} 道`;
  if (!visible.length){
    $('list').innerHTML = `<div class="empty">沒有符合的食譜，換個食材或關鍵字試試。<br><button class="reset" id="reset">清除篩選</button></div>`;
    return;
  }
  const cats = state.cat === '全部' ? Object.keys(DATA) : [state.cat];
  $('list').innerHTML = cats.map(c => {
    const rs = visible.filter(r => r.cat === c);
    if (!rs.length) return '';
    return `<section class="group">${state.cat === '全部' ? `<h2>${c}</h2>` : ''}<div class="grid">${rs.map(card).join('')}</div></section>`;
  }).join('');
}
function render(){ renderBar(); renderList(); }

/* 食譜頁 */
let current = -1, lastFocus = null, pushed = false;
function openRecipe(idx, fromPager){
  const r = ALL[idx]; current = idx;
  const pos = visible.indexOf(r);
  const prev = pos > 0 ? visible[pos - 1] : null, next = pos >= 0 && pos < visible.length - 1 ? visible[pos + 1] : null;
  const d = DIAG[r.n];
  $('sheet').innerHTML = `
    <div class="sh-head"><div>
      <span class="eyebrow">${esc(r.cat)}</span>
      <h2 id="sh-title">${esc(r.n)}</h2>
      <div class="meta"><span>${esc(r.t)}</span>・<span>${esc(r.s)}</span>・<span>${esc(r.p)}</span></div>
    </div><button class="close" id="close" aria-label="關閉">×</button></div>
    <div class="sh-body">
      <div class="figure">${drawing(r, d[0].split(','))}<div class="flow">${flow(d[1])}</div></div>
      <section class="sec"><h3>食材 <small>點一下打勾</small></h3>
        <ul class="ings">${r.i.map(x => `<li><button type="button"><span class="box"></span><span class="txt">${esc(x)}</span></button></li>`).join('')}</ul></section>
      <section class="sec"><h3>步驟</h3><ol class="steps">${r.st.map(x => `<li><span>${esc(x)}</span></li>`).join('')}</ol></section>
      <div class="tip"><b>小撇步</b>${esc(r.tip)}</div>
      <div class="pager">
        <button id="prev" ${prev ? `data-id="${ALL.indexOf(prev)}"` : 'disabled'}><small>上一道</small><span>${prev ? esc(prev.n) : ''}</span></button>
        <button id="next" ${next ? `data-id="${ALL.indexOf(next)}"` : 'disabled'}><small>下一道</small><span>${next ? esc(next.n) : ''}</span></button>
      </div>
    </div>`;
  $('sheet').scrollTop = 0;
  if (!fromPager){
    lastFocus = document.activeElement;
    $('scrim').hidden = false;
    document.body.style.overflow = 'hidden';
    try { history.pushState({sheet:1}, ''); pushed = true; } catch(e) { pushed = false; }
  }
  $('close').focus();
}
function closeRecipe(viaPop){
  if ($('scrim').hidden) return;
  $('scrim').hidden = true;
  document.body.style.overflow = '';
  if (pushed && !viaPop){ pushed = false; try { history.back(); } catch(e) {} }
  pushed = false;
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}

$('tabs').addEventListener('click', e => {
  const b = e.target.closest('[data-cat]'); if (!b) return;
  state.cat = b.dataset.cat; render();
  try { localStorage.setItem('bruno-cat', state.cat); } catch(e) {}
});
$('chips').addEventListener('click', e => {
  const b = e.target.closest('[data-ing]'); if (!b) return;
  state.ing = state.ing === b.dataset.ing ? null : b.dataset.ing; render();
});
$('q').addEventListener('input', e => { state.q = e.target.value; renderList(); });
$('list').addEventListener('click', e => {
  if (e.target.id === 'reset'){ state.cat = '全部'; state.ing = null; state.q = ''; $('q').value = ''; render(); return; }
  const c = e.target.closest('.card'); if (c) openRecipe(+c.dataset.id);
});
$('scrim').addEventListener('click', e => { if (e.target === $('scrim')) closeRecipe(); });
$('sheet').addEventListener('click', e => {
  if (e.target.closest('#close')) return closeRecipe();
  const p = e.target.closest('#prev,#next');
  if (p && p.dataset.id) return openRecipe(+p.dataset.id, true);
  const ing = e.target.closest('.ings button');
  if (ing) ing.classList.toggle('done');
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeRecipe(); });
window.addEventListener('popstate', () => closeRecipe(true));

let saved = null;
try { saved = localStorage.getItem('bruno-cat'); } catch(e) {}
if (saved && (saved === '全部' || DATA[saved])) state.cat = saved;
render();
</script>
</body>
</html>
